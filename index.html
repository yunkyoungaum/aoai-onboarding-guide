<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Azure OpenAI 실무 가이드 모음</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 2.5rem 1rem 4rem;
  background: var(--cp-bg);
  color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 980px; margin: 0 auto; }

header.page {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 1rem; margin-bottom: 2rem;
}
header.page h1 { font-size: 1.85rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
header.page p { margin: 0; color: var(--cp-text-muted); font-size: 0.95rem; }
.toggle {
  flex: 0 0 auto; cursor: pointer;
  border: 1px solid var(--cp-border); background: var(--cp-surface-soft);
  color: var(--cp-text); border-radius: 0.625rem; padding: 7px 14px;
  font-size: 13px; font-family: inherit;
}
.toggle:hover { border-color: var(--cp-accent); color: var(--cp-accent); }
.language-bar {
  display: inline-flex; padding: 3px; border: 1px solid var(--cp-border);
  border-radius: 0.625rem; background: var(--cp-surface-soft);
}
.language-bar button {
  min-width: 70px; padding: 4px 10px; border: 0; border-radius: 7px;
  color: var(--cp-text-muted); background: transparent; cursor: pointer; font: 600 13px inherit;
}
.language-bar button[aria-pressed="true"] { color: var(--cp-accent-fg); background: var(--cp-accent); }

.toolbar { margin-bottom: 1.25rem; }
#search {
  width: 100%; padding: 0.7rem 0.95rem; font-size: 0.95rem; font-family: inherit;
  color: var(--cp-text); background: var(--cp-surface);
  border: 1px solid var(--cp-border); border-radius: 0.625rem;
}
#search:focus { outline: none; border-color: var(--cp-accent); }
#search::placeholder { color: var(--cp-text-soft); }

.cards { display: grid; grid-template-columns: 1fr; gap: 1rem; }

.card {
  position: relative;
  display: block; text-decoration: none; color: inherit;
  background: var(--cp-surface);
  border: 1px solid var(--cp-border);
  border-radius: 16px;
  padding: 1.3rem 1.5rem;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
  transition: border-color .15s ease, transform .15s ease;
  cursor: pointer;
}
.card:hover { border-color: var(--cp-accent); transform: translateY(-2px); }
.card h2 a { color: inherit; text-decoration: none; }
.card:hover h2 a { color: var(--cp-accent); }

.card-head { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.55rem; }
.num {
  flex: 0 0 auto; min-width: 2.1rem; height: 2.1rem; padding: 0 0.45rem;
  border-radius: 0.625rem; background: var(--cp-accent); color: var(--cp-accent-fg);
  display: grid; place-items: center; font-weight: 700; font-size: 0.95rem;
}
.card-head h2 { font-size: 1.12rem; margin: 0; font-weight: 650; }
.draft {
  font-size: 0.68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  background: var(--cp-warning); color: #1a1a1a; padding: 2px 7px; border-radius: 999px;
}
.summary { margin: 0 0 0.8rem; color: var(--cp-text-muted); font-size: 0.92rem; }
.metarow { display: flex; align-items: center; flex-wrap: wrap; gap: 0.4rem; }
.tag {
  font-size: 0.75rem; color: var(--cp-accent); background: var(--cp-accent-soft);
  border: 1px solid var(--cp-border); border-radius: 999px; padding: 2px 9px;
}
.updated { margin-left: auto; font-size: 0.78rem; color: var(--cp-text-soft); white-space: nowrap; }
.srclink { font-size: 0.78rem; color: var(--cp-link); text-decoration: none; }
.srclink:hover { text-decoration: underline; }

.empty { color: var(--cp-text-soft); font-size: 0.92rem; padding: 1.5rem 0; }

footer.page {
  margin-top: 2.5rem; padding-top: 1.2rem; border-top: 1px solid var(--cp-border);
  color: var(--cp-text-soft); font-size: 0.83rem;
}
footer.page a { color: var(--cp-link); text-decoration: none; }
footer.page a:hover { text-decoration: underline; }
footer.page code {
  font-family: Consolas, "Courier New", Courier, monospace;
  background: var(--cp-surface-soft); border: 1px solid var(--cp-border);
  border-radius: 5px; padding: 0.08rem 0.32rem; font-size: 0.82em;
}
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div>
      <h1>Azure OpenAI 실무 가이드 모음</h1>
      <p>현장에서 반복적으로 마주치는 Azure OpenAI 설계·운영 주제를 가이드 단위로 정리합니다.</p>
    </div>
    <div>
      <span class="language-bar" id="languageBar" role="group" aria-label="Language / 언어">
        <button type="button" data-lang-btn="ko">한국어</button>
        <button type="button" data-lang-btn="en">English</button>
      </span>
      <button class="toggle" id="themeToggle" type="button">테마 전환</button>
    </div>
  </header>

  <div class="toolbar">
    <input id="search" type="search" placeholder="제목 · 요약 · 태그 검색 (예: PTU, 모니터링, 온보딩)" autocomplete="off" />
  </div>

  <div class="cards" id="cards"></div>
  <p class="empty" id="empty" hidden>검색 결과가 없습니다.</p>

  <footer class="page">
    <p id="footerCopy">
      가이드를 추가하려면 <code>guides/&lt;번호&gt;-&lt;슬러그&gt;/index.html</code>을 만들고
      <code>guides.js</code>의 <code>GUIDES</code> 배열에 항목을 추가하세요.
      자세한 절차는 <a href="README.md">README</a>를 참고하세요.
    </p>
  </footer>
</div>

<script src="guides.js"></script>
<script>
(function () {
  var list = (window.GUIDES || []).slice().sort(function (a, b) {
    return String(a.no).localeCompare(String(b.no));
  });
  var cards = document.getElementById("cards");
  var empty = document.getElementById("empty");
  var search = document.getElementById("search");
  var toggle = document.getElementById("themeToggle");
  var languageBar = document.getElementById("languageBar");
  var params = new URLSearchParams(window.location.search);
  var requestedLanguage = params.get("lang");
  var storedLanguage = localStorage.getItem("aoai-guide-language");
  var browserLanguage = navigator.language.toLowerCase().startsWith("ko") ? "ko" : "en";
  var language = requestedLanguage === "ko" || requestedLanguage === "en"
    ? requestedLanguage
    : (storedLanguage === "ko" || storedLanguage === "en" ? storedLanguage : browserLanguage);

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function cardHtml(g) {
    var href = "guides/" + esc(g.slug) + "/?lang=" + language;
    var tags = (language === "en" ? (g.tagsEn || g.tags) : g.tags || []).map(function (t) {
      return '<span class="tag">' + esc(t) + "</span>";
    }).join("");
    var draft = g.status === "draft" ? '<span class="draft">draft</span>' : "";
    var src = g.source
      ? '<a class="srclink" href="guides/' + esc(g.slug) + "/" + esc(g.source) + '">' + (language === "en" ? "Source (.md)" : "원본(.md)") + "</a>"
      : "";
    // 앵커 중첩은 잘못된 HTML이므로 카드는 div로 두고 제목만 링크로 둔다.
    return '' +
      '<div class="card" data-href="' + href + '">' +
        '<div class="card-head">' +
          '<span class="num">' + esc(g.no) + "</span>" +
          '<h2><a href="' + href + '">' + esc(language === "en" ? (g.titleEn || g.title) : g.title) + "</a></h2>" + draft +
        "</div>" +
          '<p class="summary">' + esc(language === "en" ? (g.summaryEn || g.summary) : g.summary) + "</p>" +
        '<div class="metarow">' + tags + src +
          '<span class="updated">' + (language === "en" ? "Updated " : "업데이트 ") + esc(g.updated) + "</span>" +
        "</div>" +
      "</div>";
  }

  function render(q) {
    var needle = (q || "").trim().toLowerCase();
    var shown = list.filter(function (g) {
      if (!needle) return true;
      var hay = [g.no, g.title, g.titleEn, g.summary, g.summaryEn].concat(g.tags || [], g.tagsEn || []).join(" ").toLowerCase();
      return hay.indexOf(needle) !== -1;
    });
    cards.innerHTML = shown.map(cardHtml).join("");
    empty.hidden = shown.length > 0;
  }

  // 카드 어디를 눌러도 이동. 단, 내부 링크(원본 .md, 제목)는 자기 동작을 유지.
  cards.addEventListener("click", function (e) {
    if (e.target.closest("a")) return;
    var card = e.target.closest(".card");
    if (card && card.dataset.href) window.location.href = card.dataset.href;
  });

  search.addEventListener("input", function () { render(search.value); });

  toggle.addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });

  function applyLanguage(nextLanguage, persist) {
    language = nextLanguage === "en" ? "en" : "ko";
    localStorage.setItem("aoai-guide-language", language);
    document.documentElement.lang = language;
    document.title = language === "en" ? "Azure OpenAI practical guides" : "Azure OpenAI 실무 가이드 모음";
    languageBar.querySelectorAll("[data-lang-btn]").forEach(function (button) {
      button.setAttribute("aria-pressed", String(button.dataset.langBtn === language));
    });
    document.querySelector("header.page h1").textContent = language === "en" ? "Azure OpenAI practical guides" : "Azure OpenAI 실무 가이드 모음";
    document.querySelector("header.page p").textContent = language === "en" ? "Practical guides for recurring Azure OpenAI design and operations topics." : "현장에서 반복적으로 마주치는 Azure OpenAI 설계·운영 주제를 가이드 단위로 정리합니다.";
    toggle.textContent = language === "en" ? "Toggle theme" : "테마 전환";
    search.placeholder = language === "en" ? "Search title, summary, or tags (for example: PTU, monitoring, onboarding)" : "제목 · 요약 · 태그 검색 (예: PTU, 모니터링, 온보딩)";
    empty.textContent = language === "en" ? "No guides found." : "검색 결과가 없습니다.";
    document.getElementById("footerCopy").innerHTML = language === "en"
      ? 'To add a guide, create <code>guides/&lt;number&gt;-&lt;slug&gt;/index.html</code> and add an entry to the <code>GUIDES</code> array in <code>guides.js</code>. See the <a href="README.md">README</a> for details.'
      : '가이드를 추가하려면 <code>guides/&lt;번호&gt;-&lt;슬러그&gt;/index.html</code>을 만들고 <code>guides.js</code>의 <code>GUIDES</code> 배열에 항목을 추가하세요. 자세한 절차는 <a href="README.md">README</a>를 참고하세요.';
    params.set("lang", language);
    history.replaceState(null, "", window.location.pathname + "?" + params.toString() + window.location.hash);
    if (persist) localStorage.setItem("aoai-guide-language", language);
    render(search.value);
  }

  languageBar.addEventListener("click", function (event) {
    var button = event.target.closest("[data-lang-btn]");
    if (button) applyLanguage(button.dataset.langBtn, true);
  });

  applyLanguage(language, false);
})();
</script>
</body>
</html>
